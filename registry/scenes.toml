# Named presets. The per-atlas scenes reproduce what an atlas-centric design
# would have offered as separate viewers -- which was the argument for building
# the space-centric one: those viewers are a special case of this, not a
# different architecture (design.md section 1).

# Each space names one of these as its `default_scene`: a single atlas, so
# two are not stacked on top of each other at startup, plus that space's
# reference image behind it.
[benton2025]
title = "Benton 2025 + stain (FAFB)"
space = "FAFB14"
layers = [
  { ref = "benton2025" },
  { ref = "fafb_stain" },
  { ref = "fafb_neuropil", visible = false },
]

[hemibrain]
title = "neuPrint hemibrain + stain"
space = "JRCFIB2018F"
layers = [
  { ref = "neuprint_hemibrain" },
  { ref = "hemibrain_stain" },
  { ref = "neuprint_hemibrain_neuropil", visible = false },
]

[male_cns]
title = "neuPrint male CNS + stain"
space = "JRCFIB2022M"
layers = [
  { ref = "neuprint_cns" },
  { ref = "malecns_stain" },
  { ref = "neuprint_cns_neuropil", visible = false },
]

# Grabe has no virtual stain -- it is light microscopy, not EM -- so the
# analogous backdrop is its own confocal channel.
[grabe2015]
title = "Grabe 2015 + confocal stack (island)"
space = "GRABE"
layers = [
  { ref = "grabe2015" },
  { ref = "grabe2015_stack" },
  { ref = "grabe2015_labels", visible = false },
]

# Cross-atlas scenes: the thing an atlas-centric design cannot express.

[hemibrain_three_ways]
title = "hemibrain glomeruli: neuPrint vs Schlegel RN- and PN-based"
space = "JRCFIB2018F"
layers = [
  { ref = "neuprint_hemibrain" },
  { ref = "schlegel2021_s11" },
  { ref = "schlegel2021_s12" },
  { ref = "neuprint_hemibrain_neuropil", visible = false },
]
